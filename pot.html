  <a class="kit-tab" data-kit="overall" href="index.html"><img src="assets/overall.png" alt="Overall"><span>Overall</span></a>

  <a class="kit-tab" data-kit="pot" href="pot.html"><img src="assets/pot.png" alt="Pot"><span>Pot</span></a>

<main class="page">
<div class="toolbar"><button class="btn blue" onclick="openModal('playerModal')">＋ Add Player</button><button class="btn blue" onclick="openModal('tierModal')">＋ Add Tier</button></div>
<h1><img src="assets/pot.png" style="width:42px;height:42px;vertical-align:middle;border-radius:50%;object-fit:contain"> Pot</h1>
<div id="playerList"></div>
<div class="modal" id="playerModal"><div class="modal-box"><h2>Add Player</h2>
<form onsubmit="event.preventDefault();addPlayer()">
<div class="field"><label>Player Name</label><input id="playerName" required></div>
<div class="row"><div class="field"><label>Player Tier</label><select id="playerTier"></select></div><div class="field"><label>Rank</label><select id="playerRank"><option>Combat Grandmaster</option><option>Combat Ace</option><option>Combat Master</option><option>Combat Specialist</option><option>Combat Apprentice</option></select></div></div>
<div class="row"><div class="field"><label>Points</label><input id="playerPoints" type="number" min="0" value="0"></div><div class="field"><label>Region</label><select id="playerRegion"><option>NA</option><option>EU</option><option>AS</option><option>OCE</option><option>SA</option></select></div></div>
<div class="field"><label>Skin</label><input id="playerSkin" type="file" accept="image/*"></div>
<div class="field"><label>Kit + Tier</label><div class="row"><select id="comboKit"></select><select id="comboTier"></select></div><button type="button" class="btn" onclick="addCombo()">＋ Add Kit Tier</button><div id="chosen" class="chosen"></div></div>
<div class="actions"><button type="button" class="btn" onclick="closeModal('playerModal')">Cancel</button><button class="btn blue">Add Player</button></div></form></div></div>
<div class="modal" id="tierModal"><div class="modal-box"><h2>Add Tier</h2><div class="field"><label>Tier Name</label><input id="tierName" placeholder="HT1"></div><div class="field"><label>Kit</label><select id="tierKit"></select></div><div class="actions"><button class="btn" onclick="closeModal('tierModal')">Cancel</button><button class="btn blue" onclick="addTier()">Add Tier</button></div></div></div>
</main>
<script>document.querySelectorAll('.kit-tab').forEach(function(a){if((document.body.getAttribute('data-kit')||'').toLowerCase()===a.getAttribute('data-kit'))a.classList.add('active')});</script>
<script src="script.js?v=20260831"></script></body></html>
