<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlastTier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">BLAST<span>TIER</span></div>
  <nav>
    <button>⌂ Home</button><button>🏆 Rankings</button>
    <button>🎮 Discords</button><button>▣ API Docs</button>
  </nav>
  <input placeholder="Search player...">
</header>

<div class="kit-tabs">
  <button class="kit active"><img src="assets/overall.png"><b>Overall</b></button>
  <button class="kit"><img src="assets/ltms.png"><b>LTMs</b></button>
  <button class="kit"><img src="assets/vanilla.png"><b>Vanilla</b></button>
  <button class="kit"><img src="assets/uhc.png"><b>UHC</b></button>
  <button class="kit"><img src="assets/pot.png"><b>Pot</b></button>
  <button class="kit"><img src="assets/nethop.png"><b>NethOP</b></button>
  <button class="kit"><img src="assets/smp.png"><b>SMP</b></button>
  <button class="kit"><img src="assets/sword.png"><b>Sword</b></button>
  <button class="kit"><img src="assets/axe.png"><b>Axe</b></button>
  <button class="kit"><img src="assets/mace.png"><b>Mace</b></button>
</div>

<main>
  <div class="toolbar">
    <button>ⓘ Information</button>
    <button class="add">＋ Add Player</button>
    <button class="add">＋ Add Tier</button>
    <button class="add">＋ Add Kit</button>
  </div>
  <div class="empty">
    <div class="trophy">🏆</div>
    <h2>No players yet!</h2>
    <p>Add a player to start the rankings.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
